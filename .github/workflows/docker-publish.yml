name: Publish Docker image to GHCR

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/sandbox-api:latest
            ghcr.io/sudo-which-qp/sandbox-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger redeploy webhook
        if: success()
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/application.redeploy" \
          -H 'accept: application/json' \
          -H 'Content-Type: application/json' \
          -H "x-api-key: ${{ secrets.API_KEY }}" \
          -d '{"applicationId": "${{ secrets.DOKPLOY_APP_ID }}", "title": "Rebuild deployment", "description": "this is a rebuild deployment from github actions"}'