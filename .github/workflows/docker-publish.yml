name: Publish Docker image to GHCR

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Recreate .env file from GitHub Secret
        run: echo "${{ secrets.DOTENV_FILE }}" > .env

      # --- NEW STEPS: Set up Buildx for multi-arch ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # This makes the build use the new builder instance by default
          driver-opts: |
            image=moby/buildkit:master
          # Optional: Uncomment to make this builder instance persistent
          # install: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          # --- THE CRITICAL CHANGE: Specify platforms ---
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sudo-which-qp/evently-staging-api:latest
            ghcr.io/sudo-which-qp/evently-staging-api:${{ github.sha }}

      - name: Trigger redeploy webhook
        if: success()
        run: |
          curl -X POST "${{ secrets.REDEPLOY_WEBHOOK }}"